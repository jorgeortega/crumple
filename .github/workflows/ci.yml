# Off until GitHub Actions returns in December 2026: until then this only runs by
# hand, and the pre-push hook (.githooks/pre-push) is the gate. To switch it on, add
# "push: { branches: [main] }" and "pull_request:" under "on".
name: check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
