# The public demo. `wrangler dev` runs it on this machine in workerd and deploys nothing.
# Deploying, or changing a limit here, is the owner's call: see docs/runbooks/hosted-demo.md.
name = "crumple-demo"
main = "index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Only the custom domain: no workers.dev address or preview URLs for anyone to find.
workers_dev = false
preview_urls = false
routes = [{ pattern = "crumple.latitude10.tech", custom_domain = true }]

[assets]
directory = "public"

# Copies the latest proof report in for the page, before dev and deploy. Wrangler runs this from the
# folder it was started in, which is the repo's root for every command in package.json and the runbook.
[build]
command = "node scripts/demo-assets.mjs"
watch_dir = "../proof"

# Nothing is stored about visitors, and that includes logs.
[observability]
enabled = false

[vars]
DAILY_CAP = "20000"

[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# A placeholder until the first deploy, which replaces it with the real database's id. Local runs need
# none, and a deploy with this id fails rather than doing anything.
[[d1_databases]]
binding = "DB"
database_name = "crumple-demo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
